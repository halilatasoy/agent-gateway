{{- if and .Values.mcp.enabled .Values.mcp.demoServer.enabled }}
{{- $d := .Values.mcp.demoServer }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $d.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentgateway-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mcp-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: mcp-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: {{ $d.image }}
          # Yalnızca demo: paket pod açılışında npm'den indirilir (internet erişimi gerekir).
          command: ["npx", "-y", {{ $d.package | quote }}, "streamableHttp"]
          env:
            - name: PORT
              value: "3001"
            - name: HOME
              value: /tmp
          ports:
            - name: http
              containerPort: 3001
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- with $d.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $d.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentgateway-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-demo
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mcp-demo
  ports:
    - name: http
      port: 80
      targetPort: http
      appProtocol: agentgateway.dev/mcp
{{- end }}
