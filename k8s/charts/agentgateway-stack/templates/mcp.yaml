{{- if .Values.mcp.enabled }}
{{- $targets := include "agentgateway-stack.mcpTargets" . | fromYamlArray }}
{{- if not $targets }}
{{- fail "mcp.enabled=true ama hiç hedef yok: mcp.targets ekleyin veya mcp.demoServer.enabled=true yapın" }}
{{- end }}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentgateway-stack.labels" . | nindent 4 }}
spec:
  mcp:
    prefixMode: {{ .Values.mcp.prefixMode }}
    failureMode: {{ .Values.mcp.failureMode }}
    targets:
      {{- range $targets }}
      - name: {{ .name }}
        static:
          host: {{ .host }}
          port: {{ .port }}
          path: {{ .path | default "/mcp" }}
          protocol: {{ .protocol | default "StreamableHTTP" }}
      {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentgateway-stack.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- include "agentgateway-stack.parentRef" . | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.mcp.path }}
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: mcp
{{- end }}
