{{- /*
  DB parolası ilk kurulumda rastgele üretilir; yükseltmelerde lookup ile mevcut değer korunur
  (aksi halde her helm upgrade parolayı değiştirip PostgreSQL ile uygulamayı ayrıştırırdı).
*/ -}}
{{- $secretName := include "agc.dbSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $password := randAlphaNum 32 }}
{{- if and $existing $existing.data (hasKey $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agc.labels" . | nindent 4 }}
  annotations:
    # helm uninstall sonrası da korunur; veriler (PVC) ile birlikte kalır.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ $password | quote }}
  connectionString: {{ printf "Host=%s;Port=5432;Database=%s;Username=%s;Password=%s" (include "agc.postgresName" .) .Values.postgres.database .Values.postgres.username $password | quote }}
